name: Push to GitHub Pages and push to main

on:
  push:
    branches:
      - main

jobs:
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # https://github.com/actions/checkout/releases/tag/v6.0.2
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # https://github.com/peaceiris/actions-hugo/releases/tag/v3.2.1
        with:
          hugo-version: "0.150.0"

      - name: Build
        run: |
          hugo --theme=axiom-2
          echo www.juanorozco.com > ./public/CNAME

      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # https://github.com/peaceiris/actions-gh-pages/releases/tag/v4.1.0
        if: github.ref == 'refs/heads/main'
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_dir: ./public
